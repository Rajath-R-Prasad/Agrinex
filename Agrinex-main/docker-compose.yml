services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrinex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    networks:
      - agrinex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      
    container_name: agrinex-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - agrinex-network

networks:
  agrinex-network:
    driver: bridge
